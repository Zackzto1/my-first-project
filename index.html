<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Motivation App</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #e5e7eb;
    }

    .card {
      width: min(560px, 92vw);
      background: #1f2937;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 42px;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1220;
      color: #e5e7eb;
      font-size: 16px;
      margin: 12px 0 14px;
    }

    /* This removes the “weird focus box/mark” when you tap */
    input:focus, button:focus {
      outline: none;
      box-shadow: none;
    }

    button {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    #output {
      margin-top: 16px;
      font-size: 20px;
      line-height: 1.4;
      min-height: 28px;
    }
  </style>
  <body>
  <div class="card">
    <h1>Mini Motivation</h1>
    <p id="output">Click the button for motivation</p>
    <button onclick="getMotivation()">Inspire Me</button>
  </div>

  <script>
    const quotes = [
      "You’re stronger than you think.",
      "Progress, not perfection.",
      "Discipline beats motivation.",
      "Small steps still move you forward.",
      "You are becoming who you’re meant to be."
    ];

    function getMotivation() {
      const output = document.getElementById("output");
      const randomIndex = Math.floor(Math.random() * quotes.length);
      
      output.classList.remove("show");

      setTimeout(() => {
        output.textContent = quotes[randomIndex];
        output.classList.add("show");
      }, 50);
    }
  </script>
</body>
</head>

<body>
  <div class="card">
    <h1>Mini Motivation App</h1>

    <input id="nameInput" type="text" placeholder="Enter your name" />

    <button onclick="runApp()">Run App</button>
    <button onclick="clearApp()" class="secondary">Clear</button>

    <div id="output"></div>
  </div>

    <script>
function runApp() {
  const name = document.getElementById("nameInput").value;
  const output = document.getElementById("output");

  if (name.trim() === "") {
    output.textContent = "Enter your name first.";
    return;
  }
const messages = [
  "You're building something real.",
  "Small steps every day.",
  "Stay disciplined.",
  "You're not quitting this time.",
  "Momentum is everything."
]; 

const randomIndex = Math.floor(Math.random() * messages.length);
output.textContent = messages[randomIndex] + " " + name + ".";
  
}

function clearApp() {
  document.getElementById("nameInput").value = "";
  document.getElementById("output").textContent = "";
  document.getElementById("nameInput").focus();
}

document.getElementById("nameInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    runApp();
  }
});
</script>
</body>
</html>
