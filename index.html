<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini Motivation App</title>

<style>
#output {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 250ms ease, transform 250ms ease;
}

#output.show {
  opacity: 1;
  transform: translateY(0);
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  color: #e5e7eb;
  transition: background 500ms ease;
  background: #0f172a;
}

.card {
  width: min(560px, 92vw);
  background: #1f2937;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  text-align: center;
}

h1 {
  margin-bottom: 18px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #6366f1;
  color: white;
  cursor: pointer;
  margin-top: 16px;
}

button:hover {
  background: #4f46e5;
}
</style>
</head>

<body>
  <div class="card">
    <h1>Mini Motivation</h1>
    <p id="output">Loading...</p>
    <button onclick="newQuote()">New Quote</button>
    <button onclick="dailyQuote()">Daily Quote</button>
  </div>

<script>
const quotes = [
  "You’re stronger than you think.",
  "Progress, not perfection.",
  "Discipline beats motivation.",
  "Small steps still move you forward.",
  "You are becoming who you’re meant to be.",
  "Calm mind. Clear direction.",
  "Act, don’t overthink.",
  "Your future self is watching."
];

const colors = [
  "#0f172a",
  "#1e293b",
  "#111827",
  "#1f2937",
  "#0b1120"
];

const output = document.getElementById("output");

function animateQuote(text) {
  output.classList.remove("show");
  setTimeout(() => {
    output.textContent = text;
    output.classList.add("show");
  }, 50);
}

function randomBackground() {
  const randomColor = colors[Math.floor(Math.random() * colors.length)];
  document.body.style.background = randomColor;
}

function newQuote() {
  const quote = quotes[Math.floor(Math.random() * quotes.length)];
  localStorage.setItem("lastQuote", quote);
  animateQuote(quote);
  randomBackground();
}

function dailyQuote() {
  const today = new Date().toDateString();
  const storedDate = localStorage.getItem("quoteDate");
  const storedQuote = localStorage.getItem("dailyQuote");

  if (storedDate === today && storedQuote) {
    animateQuote(storedQuote);
  } else {
    const quote = quotes[Math.floor(Math.random() * quotes.length)];
    localStorage.setItem("dailyQuote", quote);
    localStorage.setItem("quoteDate", today);
    animateQuote(quote);
  }

  randomBackground();
}

window.onload = () => {
  const saved = localStorage.getItem("lastQuote");
  if (saved) {
    animateQuote(saved);
  } else {
    newQuote();
  }
};
</script>

</body>
</html>
