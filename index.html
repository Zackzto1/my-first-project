<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini Motivation App</title>

<link rel="apple-touch-icon" sizes="512x512" href="icon.png">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
#output {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 250ms ease, transform 250ms ease;
}

#output.show {
  opacity: 1;
  transform: translateY(0);
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  color: #e5e7eb;
  transition: background 500ms ease;
  background: linear-gradient(135deg, #0f172a, #1e293b);
}

.card {
  width: min(560px, 92vw);
  background: #1f2937;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  text-align: center;
  backdrop-filter: blur(10px);
border: 1px solid rgba(255,255,255,0.05);
}

h1 {
  margin-bottom: 18px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #6366f1;
  color: white;
  cursor: pointer;
  margin-top: 16px;
  transition: all 200ms ease;
}

button:hover {
  background: #4f46e5;
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(99,102,241,0.4);
}
footer {
  margin-top: 20px;
  font-size: 14px;
  opacity: 0.6;
}
</style>
</head>

<body>
  <div class="card">
    <h1>Mini Motivation</h1>
    <p id="output">Loading...</p>
    <button onclick="newQuote()">New Quote</button>
<button onclick="dailyQuote()">Daily Quote</button>
    <button onclick="shareQuote()">Share Quote</button>
    <button onclick="saveFavorite()">Save Favorite</button>
    <button onclick="toggleTheme()">Toggle Theme</button>
    <footer>
  Built by Zack
</footer>
  </div>

<script>
const quotes = [
  "You’re stronger than you think.",
  "Progress, not perfection.",
  "Discipline beats motivation.",
  "Small steps still move you forward.",
  "You are becoming who you’re meant to be.",
  "Calm mind. Clear direction.",
  "Act, don’t overthink.",
  "Your future self is watching."
  const clickSound = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
];

const colors = [
  "#0f172a",
  "#1e293b",
  "#111827",
  "#1f2937",
  "#0b1120"
];

const output = document.getElementById("output");

function animateQuote(text) {
  output.classList.remove("show");
  setTimeout(() => {
    output.textContent = text;
    output.classList.add("show");
  }, 50);
}

function randomBackground() {
  const randomColor = colors[Math.floor(Math.random() * colors.length)];
  document.body.style.background = randomColor;
}

function newQuote(clickSound.play(); {
  const quote = quotes[Math.floor(Math.random() * quotes.length)];
  localStorage.setItem("lastQuote", quote);
  animateQuote(quote);
  randomBackground();
}

function dailyQuote() {
  const today = new Date().toDateString();
  const storedDate = localStorage.getItem("quoteDate");
  const storedQuote = localStorage.getItem("dailyQuote");

  if (storedDate === today && storedQuote) {
    animateQuote(storedQuote);
  } else {
    const quote = quotes[Math.floor(Math.random() * quotes.length)];
    localStorage.setItem("dailyQuote", quote);
    localStorage.setItem("quoteDate", today);
    animateQuote(quote);
  }

  randomBackground();
}

function shareQuote() {
  const text = output.textContent;

  if (navigator.share) {
    navigator.share({
      title: "Mini Motivation",
      text: text,
      url: window.location.href
    });
  } else {
    alert("Sharing not supported on this device.");
  }
}

window.onload = () => {
  const saved = localStorage.getItem("lastQuote");
  if (saved) {
    animateQuote(saved);
  } else {
    newQuote(););
  }
};
</script>

</body>
</html>
